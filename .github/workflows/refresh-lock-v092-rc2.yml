name: Refresh v0.9.2 DSH rc2 lock once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'fix/v0.9.2-security-hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout controlled branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/v0.9.2-security-hardening
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Regenerate committed lock without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-lock-v092-rc2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/refresh-lock-v092-rc2.yml
          git diff --cached --check
          git commit -m "chore: sync lock to DSH 0.1.1-rc.2"
          git push origin HEAD:fix/v0.9.2-security-hardening
