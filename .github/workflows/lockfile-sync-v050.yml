name: v0.5 lockfile sync

on:
  push:
    branches:
      - feature/bundled-skins-v050-20260816

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bundled-skins-v050-20260816
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Regenerate lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify pinned bundled skin
        run: node -e "const l=require('./package-lock.json'); const p=l.packages['node_modules/@linxin666/dsh-skins']; if(!p||p.version!=='0.1.18') process.exit(1); console.log(p.version)"
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: sync v0.5.0 lockfile"
          git push origin HEAD:feature/bundled-skins-v050-20260816
