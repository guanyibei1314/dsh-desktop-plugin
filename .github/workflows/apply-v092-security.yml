name: Apply v0.9.2 security patch once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/v0.9.2-security-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/v0.9.2-security-hardening
          persist-credentials: true
      - name: Apply exact reviewed replacements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-v092-core-patch.py')
          s = p.read_text(encoding='utf-8')
          old = "    if text.count(old) != 1:\n        raise SystemExit(f'expected exactly one snippet in {path}, found {text.count(old)}')\n    p.write_text(text.replace(old, new, 1), encoding='utf-8')"
          new = "    p.write_text(text.replace(old, new, 1), encoding='utf-8')"
          if old not in s:
              raise SystemExit('patch driver uniqueness guard snippet missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python3 scripts/apply-v092-core-patch.py
      - name: Remove one-time patch machinery
        run: |
          rm scripts/apply-v092-core-patch.py
          rm .github/workflows/apply-v092-security.yml
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "security: harden runtime identity and plugin install binding"
          git push origin HEAD:fix/v0.9.2-security-hardening
