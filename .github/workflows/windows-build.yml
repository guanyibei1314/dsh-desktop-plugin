name: Windows build

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Regenerate exact official dependency lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit package lock to PR branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if (git diff --cached --quiet) {
            Write-Host '[lock-sync] package-lock.json already current'
            exit 0
          }
          git commit -m "chore: sync package lock for DSH rc.7"
          git push origin "HEAD:${{ github.head_ref }}"
          Write-Host '[lock-sync] committed exact rc.7 dependency lock'
