name: Windows build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static syntax checks
        shell: pwsh
        run: |
          node --check main.js
          node --check preload.js
          node --check scripts/release.js

      - name: Build Windows installer
        run: npm run dist

      - name: Report installer size
        shell: pwsh
        run: |
          $exe = Get-Item "dist/DSH-Desktop-Setup-*.exe" | Select-Object -First 1
          if (-not $exe) { throw "installer not found" }
          $mib = [math]::Round($exe.Length / 1MB, 2)
          Write-Host "INSTALLER_PATH=$($exe.FullName)"
          Write-Host "INSTALLER_BYTES=$($exe.Length)"
          Write-Host "INSTALLER_MIB=$mib"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows
          path: |
            dist/DSH-Desktop-Setup-*.exe
            dist/DSH-Desktop-Setup-*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 7

  publish:
    # Guarded publisher: only an intentional main-branch release commit can
    # replace public Release assets. PR jobs remain contents:read only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified installer artifact
        uses: actions/download-artifact@v4
        with:
          name: dsh-desktop-windows
          path: dist

      - name: Replace v0.3.0 Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/DSH-Desktop-Setup-0.3.0.exe
          gh release upload v0.3.0 \
            dist/DSH-Desktop-Setup-0.3.0.exe \
            dist/DSH-Desktop-Setup-0.3.0.exe.blockmap \
            dist/latest.yml \
            --clobber \
            --repo guanyibei1314/dsh-desktop-plugin
          gh release edit v0.3.0 \
            --repo guanyibei1314/dsh-desktop-plugin \
            --notes $'## DSH Desktop 0.3.0\n\n零配置开箱即用：自动连接本机 DSH；没有则启动内置 DeepSeek Harness。\n\n### 2026-08-16 安全与体积优化\n- 主 DSH Web 页面不再获得 desktop/terminal IPC bridge；PTY/Shell 权限仅暴露给精确匹配的本地终端页。\n- 本地高权限页面增加 CSP。\n- Windows 安装包由约 135.50 MiB 降至约 120.12 MiB（约 -11.35%），保留完整内置 DSH。\n- Windows CI 已完成 npm ci、语法检查与 NSIS 实际构建。'
