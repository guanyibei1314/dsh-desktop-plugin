name: Windows build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies from committed lock
        run: npm ci

      - name: Toolchain manifest security checks
        run: npm run test:toolchain-manifest

      - name: Verify pinned full toolchain matches official latest
        run: npm run verify:official-toolchain

      - name: Static syntax checks
        run: npm run check

      - name: Security hardening regression tests
        run: npm run test:security-hardening

      - name: DSH runtime updater functional tests
        run: npm run test:runtime-update

      - name: DSH runtime updater red-blue security tests
        run: npm run test:runtime-update-security

      - name: Runtime maintenance junction and GC tests
        run: npm run test:runtime-maintenance

      - name: Verify bundled DSH equals official stable release
        run: npm run verify:official-dsh

      - name: Fast source runtime download provenance and activation probe
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:RUNNER_TEMP 'dsh-runtime-source-probe'
          $dshHome = Join-Path $env:RUNNER_TEMP 'dsh-runtime-source-home'
          foreach ($dir in @($runtimeRoot, $dshHome)) {
            if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          }
          $env:DSH_DESKTOP_RUNTIME_ROOT = $runtimeRoot
          $env:DSH_DESKTOP_DSH_HOME = $dshHome
          $env:DSH_RUNTIME_AUTO_UPDATE = '0'
          & node_modules/.bin/electron.cmd . --runtime-update-smoke
          $exit = $LASTEXITCODE
          if (Test-Path (Join-Path $runtimeRoot 'state.json')) {
            Write-Host '[source-runtime-probe] ----- state.json -----'
            Get-Content (Join-Path $runtimeRoot 'state.json') | ForEach-Object { Write-Host $_ }
          }
          if (Test-Path (Join-Path $runtimeRoot 'runtime-update.log')) {
            Write-Host '[source-runtime-probe] ----- runtime-update.log -----'
            Get-Content (Join-Path $runtimeRoot 'runtime-update.log') | ForEach-Object { Write-Host $_ }
          }
          if ($exit -ne 0) { throw "source runtime update/provenance probe failed with exit code $exit" }

      - name: Plugin market functional tests
        run: npm run test:market

      - name: Plugin market red-blue security tests
        run: npm run test:market-security

      - name: Validate PowerShell E2E scripts
        shell: pwsh
        run: |
          foreach ($script in @(
            'scripts/fetch-toolchain.ps1',
            'scripts/verify-official-toolchain.ps1',
            'scripts/verify-installed-toolchain.ps1',
            'scripts/verify-installed-app.ps1',
            'scripts/verify-installed-market.ps1',
            'scripts/verify-installed-runtime-update.ps1',
            'scripts/verify-installer-signature.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$script : $($_.Message)" }
              throw "$script has $($errors.Count) parse error(s)"
            }
            Write-Host "[e2e-parse] $script parsed successfully"
          }

      - name: Fetch and verify full Node.js and Git installers
        run: npm run prepare:toolchain

      - name: Build Windows installer
        env:
          CSC_LINK: ${{ secrets.DSH_WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DSH_WINDOWS_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.DSH_WINDOWS_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.DSH_WINDOWS_CSC_KEY_PASSWORD }}
        run: npm run dist

      - name: Verify Authenticode release policy
        shell: pwsh
        env:
          DSH_REQUIRE_SIGNED_INSTALLER: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:') }}
          DSH_WINDOWS_SIGNING_SUBJECT: ${{ secrets.DSH_WINDOWS_SIGNING_SUBJECT }}
        run: |
          $installer = (Get-Item "dist/DSH-Desktop-Setup-*.exe" | Select-Object -First 1).FullName
          $app = (Get-Item "dist/win-unpacked/DSH Desktop.exe" | Select-Object -First 1).FullName
          if (-not $installer) { throw 'built installer not found' }
          if (-not $app) { throw 'built application not found' }
          & pwsh -NoProfile -File scripts/verify-installer-signature.ps1 -InstallerPath $installer -ApplicationPath $app
          if ($LASTEXITCODE -ne 0) { throw "Authenticode policy failed with exit code $LASTEXITCODE" }

      - name: Smoke test packaged application
        shell: pwsh
        run: |
          $app = "dist/win-unpacked/DSH Desktop.exe"
          if (-not (Test-Path $app)) { throw "packaged app not found: $app" }
          $process = Start-Process -FilePath $app -ArgumentList "--smoke" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "packaged smoke failed with exit code $($process.ExitCode)" }

      - name: Verify packaged plugin runtime and offline bundled skins
        run: npm run verify:packaged-plugin

      - name: Verify installed full Node.js Git and Machine PATH
        shell: pwsh
        run: |
          $installer = (Get-Item "dist/DSH-Desktop-Setup-*.exe" | Select-Object -First 1).FullName
          if (-not $installer) { throw 'built installer not found' }
          & pwsh -NoProfile -File scripts/verify-installed-toolchain.ps1 -InstallerPath $installer
          if ($LASTEXITCODE -ne 0) { throw "installed full toolchain E2E failed with exit code $LASTEXITCODE" }

      - name: Verify installed official DSH runtime update chain
        shell: pwsh
        run: |
          $installer = (Get-Item "dist/DSH-Desktop-Setup-*.exe" | Select-Object -First 1).FullName
          if (-not $installer) { throw 'built installer not found' }
          & pwsh -NoProfile -File scripts/verify-installed-runtime-update.ps1 -InstallerPath $installer -Label official-runtime
          if ($LASTEXITCODE -ne 0) { throw "installed runtime updater E2E failed with exit code $LASTEXITCODE" }

      - name: Verify installed live market and security preflight
        shell: pwsh
        run: |
          $installer = (Get-Item "dist/DSH-Desktop-Setup-*.exe" | Select-Object -First 1).FullName
          if (-not $installer) { throw 'built installer not found' }
          & pwsh -NoProfile -File scripts/verify-installed-market.ps1 -InstallerPath $installer -Label live-security
          if ($LASTEXITCODE -ne 0) { throw "installed market/security E2E failed with exit code $LASTEXITCODE" }

      - name: Three-round clean-install cold-start restart E2E
        shell: pwsh
        run: |
          $installer = (Get-Item "dist/DSH-Desktop-Setup-*.exe" | Select-Object -First 1).FullName
          if (-not $installer) { throw 'built installer not found' }
          foreach ($round in 1..3) {
            $label = "release-candidate-$round"
            Write-Host "[release-gate] starting full chain round $round/3"
            & pwsh -NoProfile -File scripts/verify-installed-app.ps1 -InstallerPath $installer -Label $label
            if ($LASTEXITCODE -ne 0) { throw "release candidate E2E round $round failed with exit code $LASTEXITCODE" }
          }

      - name: Audit installer and unpacked runtime
        env:
          DSH_MAX_INSTALLER_MIB: '230'
          DSH_BASELINE_INSTALLER_BYTES: '130173608'
          DSH_MAX_INSTALLER_GROWTH_MIB: '110'
        run: npm run audit:package

      - name: Report installer size
        shell: pwsh
        run: |
          $exe = Get-Item "dist/DSH-Desktop-Setup-*.exe" | Select-Object -First 1
          if (-not $exe) { throw "installer not found" }
          $mib = [math]::Round($exe.Length / 1MB, 2)
          Write-Host "INSTALLER_PATH=$($exe.FullName)"
          Write-Host "INSTALLER_BYTES=$($exe.Length)"
          Write-Host "INSTALLER_MIB=$mib"

      - name: Generate installer SHA-256
        shell: pwsh
        run: |
          $exe = Get-Item "dist/DSH-Desktop-Setup-*.exe" | Select-Object -First 1
          if (-not $exe) { throw "installer not found" }
          $hash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLowerInvariant()
          $checksum = "$hash  $($exe.Name)"
          Set-Content -Path "$($exe.FullName).sha256" -Value $checksum -Encoding ascii
          Write-Host "INSTALLER_SHA256=$hash"

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dsh-desktop-windows
          path: |
            dist/DSH-Desktop-Setup-*.exe
            dist/DSH-Desktop-Setup-*.exe.sha256
            dist/DSH-Desktop-Setup-*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Verify release commit is associated with a merged PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $json = gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/pulls"
          if ($LASTEXITCODE -ne 0) { throw 'failed to query release commit PR association' }
          $prs = $json | ConvertFrom-Json
          $merged = @($prs | Where-Object { $_.merged_at -and $_.base.ref -eq 'main' })
          if ($merged.Count -lt 1) { throw 'Release blocked: release commit is not associated with a merged PR into main.' }
          Write-Host "RELEASE_PR_NUMBER=$($merged[0].number)"

      - name: Checkout release metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download verified installer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dsh-desktop-windows
          path: dist

      - name: Re-verify downloaded Authenticode and SHA-256
        env:
          DSH_WINDOWS_SIGNING_SUBJECT: ${{ secrets.DSH_WINDOWS_SIGNING_SUBJECT }}
        shell: pwsh
        run: |
          $env:DSH_REQUIRE_SIGNED_INSTALLER = '1'
          $installer = (Get-Item "dist/DSH-Desktop-Setup-*.exe" | Select-Object -First 1).FullName
          if (-not $installer) { throw 'downloaded release installer missing' }
          & pwsh -NoProfile -File scripts/verify-installer-signature.ps1 -InstallerPath $installer
          if ($LASTEXITCODE -ne 0) { throw "downloaded release Authenticode check failed with exit code $LASTEXITCODE" }
          $checksum = Get-Item "dist/DSH-Desktop-Setup-*.exe.sha256" | Select-Object -First 1
          if (-not $checksum) { throw 'release checksum file missing' }
          $expected = ((Get-Content -LiteralPath $checksum.FullName -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          if ($expected -notmatch '^[0-9a-f]{64}$') { throw 'release checksum file is malformed' }
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "downloaded release SHA-256 mismatch: expected=$expected actual=$actual" }
          Write-Host "[release] downloaded artifact SHA-256 verified: $actual"

      - name: Create or update versioned Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $version = [string]$pkg.version
          $tag = "v$version"
          $exe = "dist/DSH-Desktop-Setup-$version.exe"
          $checksum = "$exe.sha256"
          $blockmap = "$exe.blockmap"
          $latest = 'dist/latest.yml'
          foreach ($file in @($exe, $checksum, $blockmap, $latest)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "release asset missing: $file" }
          }
          $sha256 = ((Get-Content -LiteralPath $checksum -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $notes = @"
          ## DSH Desktop $version

          Security hardening release for DeepSeek Harness Desktop.

          ### v0.9.2 security baseline
          - Elevated NSIS no longer discovers Node/Git through attacker-influenced PATH; machine-owned Program Files locations are used and red-team tested.
          - Plugin OSV outage is fail-closed; one-click installs are bound to exact version, official npm Registry, tarball and SHA-512 integrity, with post-install verification/rollback.
          - Default fixed 127.0.0.1:3080 reuse is removed; Desktop owns a random loopback Runtime unless the user explicitly opts into an external DSH URL.
          - Main remote Session denies permissions by default and restricts top-level navigation/redirects to the trusted Harness origin.
          - npm/OSV/Runtime metadata readers enforce streaming byte limits before unbounded allocation.
          - Runtime updates require expected DeepSeek repository identity plus verified npm/Sigstore provenance before candidate JavaScript is executed.
          - GitHub Actions are pinned to immutable 40-character SHAs; release publication requires a merged PR association.
          - Public release artifacts are fail-closed on trusted Authenticode; publisher subject is pinned by repository secret.

          ### Windows installer SHA-256
          `$sha256`
          "@

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe $checksum $blockmap $latest --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'failed to upload release assets' }
            gh release edit $tag --title "DSH Desktop $version" --notes $notes --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'failed to edit release metadata' }
          } else {
            gh release create $tag $exe $checksum $blockmap $latest --title "DSH Desktop $version" --notes $notes --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'failed to create release' }
          }
