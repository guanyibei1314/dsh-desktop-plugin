name: v0.9.1 lock refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.head_ref == 'feat/v0.9.1-system-toolchain' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout controlled head branch
        uses: actions/checkout@v4
        with:
          ref: feat/v0.9.1-system-toolchain
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Regenerate lock without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit regenerated lock if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: refresh lock for DSH 0.1.1-rc.1'
          git push origin HEAD:feat/v0.9.1-system-toolchain
