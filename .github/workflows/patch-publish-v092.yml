name: Patch v0.9.2 publish runner once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/v0.9.2-security-hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout controlled branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/v0.9.2-security-hardening
          persist-credentials: true

      - name: Apply exact publish portability fixes
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/windows-build.yml')
          s = p.read_text(encoding='utf-8')
          old_runner = "    runs-on: ubuntu-latest\n    permissions:\n      contents: write\n      pull-requests: read\n"
          new_runner = "    runs-on: windows-latest\n    permissions:\n      contents: write\n      pull-requests: read\n"
          if s.count(old_runner) != 1:
              raise SystemExit(f'expected one publish runner block, found {s.count(old_runner)}')
          s = s.replace(old_runner, new_runner, 1)
          old_hash = "          $checksum = Get-Item \"dist/DSH-Desktop-Setup-*.exe.sha256\" | Select-Object -First 1\n          if (-not $checksum) { throw 'release checksum file missing' }\n          Push-Location dist\n          try { sha256sum -c $checksum.Name } finally { Pop-Location }\n          if ($LASTEXITCODE -ne 0) { throw 'downloaded release SHA-256 check failed' }\n"
          new_hash = "          $checksum = Get-Item \"dist/DSH-Desktop-Setup-*.exe.sha256\" | Select-Object -First 1\n          if (-not $checksum) { throw 'release checksum file missing' }\n          $expected = ((Get-Content -LiteralPath $checksum.FullName -Raw).Trim() -split '\\s+')[0].ToLowerInvariant()\n          if ($expected -notmatch '^[0-9a-f]{64}$') { throw 'release checksum file is malformed' }\n          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()\n          if ($actual -ne $expected) { throw \"downloaded release SHA-256 mismatch: expected=$expected actual=$actual\" }\n          Write-Host \"[release] downloaded artifact SHA-256 verified: $actual\"\n"
          if s.count(old_hash) != 1:
              raise SystemExit(f'expected one publish hash block, found {s.count(old_hash)}')
          s = s.replace(old_hash, new_hash, 1)
          p.write_text(s, encoding='utf-8')

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-publish-v092.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/windows-build.yml .github/workflows/patch-publish-v092.yml
          git diff --cached --check
          git commit -m "security: make release re-verification Windows-native"
          git push origin HEAD:fix/v0.9.2-security-hardening
