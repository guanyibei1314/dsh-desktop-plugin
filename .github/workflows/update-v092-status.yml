name: Update v0.9.2 handoff status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-v092-status.yml'

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true

      - name: Correct markdown fences
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('HANDOFF.md', 'DEVELOPMENT_LOG.md'):
              p = Path(name)
              text = p.read_text(encoding='utf-8').replace('````', '```')
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit docs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HANDOFF.md DEVELOPMENT_LOG.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs: fix v0.9.2 release status formatting'
          git push
