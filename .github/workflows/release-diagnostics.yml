name: Release diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-diagnostics.yml'

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose v0.9.2 release run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: 71bf471421f242352cfe35df2d44e07dd175b26b
        shell: bash
        run: |
          set -euo pipefail
          RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/windows-build.yml/runs?branch=main&event=push&per_page=20")"
          RUN_ID="$(printf '%s' "$RUNS" | jq -r --arg sha "$RELEASE_SHA" '.workflow_runs[] | select(.head_sha == $sha) | .id' | head -n1)"
          if [[ -z "$RUN_ID" || "$RUN_ID" == "null" ]]; then
            BODY=$'## v0.9.2 release diagnostics\n\nNo main push Windows build was found for release commit `'$RELEASE_SHA$'`.'
            gh pr comment 14 --repo "$GITHUB_REPOSITORY" --body "$BODY"
            exit 0
          fi
          META="$(printf '%s' "$RUNS" | jq -r --argjson id "$RUN_ID" '.workflow_runs[] | select(.id == $id) | "run=\(.id) status=\(.status) conclusion=\(.conclusion) url=\(.html_url) created=\(.created_at) updated=\(.updated_at)"')"
          LOG="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed 2>&1 || true)"
          if [[ ${#LOG} -gt 12000 ]]; then LOG="${LOG: -12000}"; fi
          BODY=$(cat <<EOF
          ## v0.9.2 release diagnostics

          \`$META\`

          ### Failed log
          \`\`\`text
          $LOG
          \`\`\`
          EOF
          )
          gh pr comment 14 --repo "$GITHUB_REPOSITORY" --body "$BODY"
