name: Patch v0.9.2 pnpm Windows exit once

on:
  push:
    branches:
      - fix/v0.9.2-security-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout controlled branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/v0.9.2-security-hardening
          persist-credentials: true

      - name: Patch strict post-install handling
        shell: python
        run: |
          from pathlib import Path
          p = Path('runtime-manager.js')
          s = p.read_text(encoding='utf-8')
          old = """  await runCaptured([\n    pnpm,\n    'add',\n    '--save-prod',\n    '--save-exact',\n    '--ignore-scripts',\n    `--registry=${REGISTRY_ORIGIN}/`,\n    `${PACKAGE_NAME}@${release.version}`,\n  ], {\n    cwd: root,\n    env: runtimeEnvironment(path.join(runtimeRoot(), 'install-home')),\n  }, 180000)\n"""
          new = """  try {\n    await runCaptured([\n      pnpm,\n      'add',\n      '--save-prod',\n      '--save-exact',\n      '--ignore-scripts',\n      `--registry=${REGISTRY_ORIGIN}/`,\n      `${PACKAGE_NAME}@${release.version}`,\n    ], {\n      cwd: root,\n      env: runtimeEnvironment(path.join(runtimeRoot(), 'install-home')),\n    }, 180000)\n  } catch (err) {\n    const detail = String(err && err.message ? err.message : err)\n    const windowsElectronCleanupExit = process.platform === 'win32'\n      && /process failed \\(2147483651\\)/.test(detail)\n      && /Done in [0-9.]+s using pnpm v[0-9.]+/.test(detail)\n    if (!windowsElectronCleanupExit) throw err\n    appendLog('pnpm reported Windows/Electron 0x80000003 after Done; continuing only to strict package/lock/publisher validation')\n  }\n"""
          if s.count(old) != 1:
              raise SystemExit(f'pnpm install anchor mismatch: {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-pnpm-exit-v092.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-manager.js .github/workflows/patch-pnpm-exit-v092.yml
          git diff --cached --check
          git commit -m "fix: tolerate verified pnpm Windows cleanup exit"
          git push origin HEAD:fix/v0.9.2-security-hardening
