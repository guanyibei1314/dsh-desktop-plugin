<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>发送消息 — DSH Desktop</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0d1117; color: #e6edf3;
    font-family: ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, Menlo, monospace;
    font-size: 13px; padding: 16px; display: flex; flex-direction: column; gap: 12px;
  }
  h1 { font-size: 14px; color: #d9a441; letter-spacing: 1px; }
  label { color: #8b949e; font-size: 12px; display: block; margin-bottom: 4px; }
  select, textarea {
    width: 100%; background: #0d1117; color: #e6edf3;
    border: 1px solid #30363d; border-radius: 6px; padding: 8px; font: inherit;
  }
  select:focus, textarea:focus { outline: none; border-color: #d9a441; }
  textarea { flex: 1; resize: none; line-height: 1.6; }
  .row { display: flex; gap: 10px; justify-content: flex-end; }
  button {
    font: inherit; cursor: pointer; padding: 6px 18px; border-radius: 6px;
    border: 1px solid #30363d; background: #0d1117; color: #e6edf3;
  }
  button:hover { border-color: #d9a441; color: #d9a441; }
  button.primary { background: #d9a441; border-color: #d9a441; color: #0d1117; font-weight: 700; }
  button.primary:hover { color: #0d1117; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .status { min-height: 16px; font-size: 12px; color: #8b949e; white-space: pre-wrap; }
  .status.ok { color: #3fb950; }
  .status.err { color: #f85149; }
</style>
</head>
<body>
  <h1>◆ 发送消息到会话</h1>
  <div>
    <label for="session">目标会话</label>
    <select id="session"></select>
  </div>
  <div style="flex:1; display:flex; flex-direction:column;">
    <label for="text">消息内容（作为普通文本发送，/ 开头会被 agent 当作命令）</label>
    <textarea id="text" placeholder="例如：帮我看一下这个仓库的 README 结构"></textarea>
  </div>
  <div class="status" id="status"></div>
  <div class="row">
    <button id="cancel">取消</button>
    <button id="send" class="primary">发送</button>
  </div>
  <script>
    var b = window.desktopBridge
    var select = document.getElementById('session')
    var text = document.getElementById('text')
    var statusEl = document.getElementById('status')
    var sendBtn = document.getElementById('send')

    function setStatus(msg, cls) {
      statusEl.textContent = msg || ''
      statusEl.className = 'status' + (cls ? ' ' + cls : '')
    }

    function loadSessions() {
      setStatus('加载会话列表…')
      b.listSessions().then(function (res) {
        select.innerHTML = ''
        if (!res || !res.items || res.items.length === 0) {
          select.innerHTML = '<option value="">（无可用会话）</option>'
          sendBtn.disabled = true
          setStatus(res && res.error ? res.error : '', 'err')
          return
        }
        for (var i = 0; i < res.items.length; i++) {
          var it = res.items[i]
          var opt = document.createElement('option')
          opt.value = it.sessionId
          opt.textContent = (it.running ? '● ' : '○ ') + it.label
          select.appendChild(opt)
        }
        var current = select.querySelector('option')
        if (current) current.selected = true
        sendBtn.disabled = false
        setStatus('')
        text.focus()
      }).catch(function (err) {
        setStatus('加载失败：' + (err && err.message || err), 'err')
      })
    }

    function send() {
      var sessionId = select.value
      var msg = text.value
      if (!sessionId || msg.trim() === '') { setStatus('请选择会话并输入内容', 'err'); return }
      sendBtn.disabled = true
      setStatus('发送中…')
      b.sendPrompt({ sessionId: sessionId, text: msg }).then(function (res) {
        if (res && res.ok) {
          setStatus('✓ 已发送，窗口将在 0.6 秒后关闭', 'ok')
          setTimeout(function () { b.closeSendDialog() }, 600)
        } else {
          setStatus('发送失败：' + (res && res.error || 'unknown'), 'err')
          sendBtn.disabled = false
        }
      }).catch(function (err) {
        setStatus('发送失败：' + (err && err.message || err), 'err')
        sendBtn.disabled = false
      })
    }

    document.getElementById('cancel').onclick = function () { b.closeSendDialog() }
    sendBtn.onclick = send
    text.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send() }
    })
    loadSessions()
  </script>
</body>
</html>
